<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark; background-color: #181818">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#181818" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mindi" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/mindi-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/mindi-512.png" />
    <title>Mindi</title>
    <style>
      /* Safari 26+ tints browser chrome from fixed top edges / body, not theme-color. */
      html,
      body {
        background-color: #181818;
        color-scheme: dark;
      }
      .safari-chrome-tint {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 2147483647;
        width: 100%;
        height: 6px;
        pointer-events: none;
        background-color: #181818;
      }
    </style>
    <script>
      /* Apply stored theme before paint so Safari chrome matches. */
      (function () {
        var themes = {
          "cursor-dark": "#181818",
          gruvbox: "#282828",
          "tokyo-night": "#1a1b26",
          catppuccin: "#1e1e2e",
          nord: "#2e3440",
          "one-dark": "#282c34",
          "github-dark": "#0d1117",
          vercel: "#000000",
          cloudflare: "#1d1f20",
        };
        var id = "cursor-dark";
        try {
          var stored = localStorage.getItem("mindi.theme");
          if (stored && themes[stored]) {
            id = stored;
          }
        } catch (e) {}
        var bg = themes[id];
        if (id !== "cursor-dark") {
          document.documentElement.setAttribute("data-theme", id);
        }
        document.documentElement.style.backgroundColor = bg;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute("content", bg);
        }
        document.addEventListener("DOMContentLoaded", function () {
          document.body.style.backgroundColor = bg;
          var tint = document.querySelector(".safari-chrome-tint");
          if (tint) {
            tint.style.backgroundColor = bg;
          }
        });
      })();
    </script>
  </head>
  <body style="background-color: #181818; color-scheme: dark">
    <div class="safari-chrome-tint" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
