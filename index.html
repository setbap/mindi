      /* Safari 26+ tints browser chrome from fixed top edges / body, not theme-color. */
      html,
      body {
        background-color: #282828;
        color-scheme: dark;
      }
      .safari-chrome-tint {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 2147483647;
        width: 100%;
        height: 6px;
        pointer-events: none;
        background-color: #282828;
      }
    </style>
  </head>
